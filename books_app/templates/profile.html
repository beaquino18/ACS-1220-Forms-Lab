{% extends 'base.html' %}

{% block content %}

<p>
Welcome to {{ user.username }}'s profile.
</p>

<p>
    {{ user.username }}'s favorite books are:

    <ul>
        {% for book in user.favorite_books %}
        <li> {{ book.title }}</li>
        {% endfor %}
    </ul>
</p>

<a href="{{ url_for('main.homepage')}}">Back to Home</a>



{% endblock %}
